name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Build (server mode)
        run: go build -tags server ./cmd/rwkv-app

      - name: Vet
        run: go vet ./...

      # Native (cgo/mlx/converter) and remote integration tests are opt-in via
      # build tags and environment variables, so they skip automatically here.
      - name: Test
        run: go test ./... -count=1 -race

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd/rwkv-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/rwkv-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
