name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout pinned BFCL data
        uses: actions/checkout@v7
        with:
          repository: ShishirPatil/gorilla
          ref: 6ea57973c7a6097fd7c5915698c54c17c5b1b6c8
          path: third_party/gorilla
          sparse-checkout: berkeley-function-call-leaderboard/bfcl_eval/data
          sparse-checkout-cone-mode: true

      - name: Verify BFCL data revision
        run: test "$(git -C third_party/gorilla rev-parse HEAD)" = "6ea57973c7a6097fd7c5915698c54c17c5b1b6c8"

      # API, library and CLI packages are pure Go and do not import Wails, so
      # they run with the race detector (cgo enabled) without needing GTK.
      - name: Test library and CLI packages (race)
        run: go test -race -count=1 ./api/... ./internal/... ./cmd/rwkv-cli/...

      # The desktop app imports Wails v3, whose Linux backend needs
      # GTK4/WebKitGTK when cgo is enabled. Build and vet it in headless
      # "server" mode with cgo disabled instead (the same tag scripts/build-app.sh
      # uses for the server executable, minus the macOS-only mlx tag).
      - name: Build app (server mode)
        run: go build -tags server ./...
        env:
          CGO_ENABLED: "0"

      - name: Vet
        run: go vet -tags server ./...
        env:
          CGO_ENABLED: "0"

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cmd/rwkv-app/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: cmd/rwkv-app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
